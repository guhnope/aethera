name: Build bootc image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bootc image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV

      ####################################################################
      # Free GitHub runner disk space
      ####################################################################

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          docker system prune -af || true
          podman system prune -af || true

          echo "Disk after cleanup"
          df -h

      ####################################################################
      # Put Podman storage on BTRFS
      ####################################################################

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
      ####################################################################
      # Diagnostics
      ####################################################################

      - name: Show storage
        run: |
          echo "Filesystem"
          df -h

          echo
          echo "Podman storage"
          podman system df || true

      ####################################################################
      # Build
      ####################################################################

      - name: Build image
        run: |
          podman build \
            -t ${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA} \
            .

          podman tag \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA} \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}

      - name: Image information
        run: |
          podman images
          podman inspect ${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}

      ####################################################################
      # Login
      ####################################################################

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ####################################################################
      # Push
      ####################################################################

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          podman push ${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}
          podman push ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}

      ####################################################################
      # Install Cosign
      ####################################################################

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      ####################################################################
      # Keyless signing
      ####################################################################

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST=$(skopeo inspect docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG} | jq -r .Digest)

          cosign sign \
            --yes \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      ####################################################################
      # Final diagnostics
      ####################################################################

      - name: Final disk usage
        if: always()
        run: |
          df -h
          podman system df || true
